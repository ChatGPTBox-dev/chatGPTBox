name: agent-temperature-implementation-v6

on:
  push:
    branches:
      - fix/optional-temperature-override

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/optional-temperature-override
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply focused temperature override changes
        shell: bash
        run: |
          cat > /tmp/apply-temperature.py.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/apply-temperature.py.gz.b64 | gzip -d > /tmp/apply-temperature.py
          python3 -m py_compile /tmp/apply-temperature.py
          python3 /tmp/apply-temperature.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        shell: bash
        run: xargs npx prettier --write < /tmp/temperature-changed-paths.txt

      - name: Validate focused tests
        shell: bash
        run: |
          node --import ./tests/setup/browser-shim.mjs --test \
            tests/unit/services/apis/temperature-params.test.mjs \
            tests/unit/services/apis/openai-api-compat.test.mjs \
            tests/unit/services/apis/azure-openai-api.test.mjs \
            tests/unit/services/apis/claude-api.test.mjs \
            tests/unit/config/user-config.test.mjs

      - name: Validate project
        shell: bash
        run: |
          git diff --check
          npm run lint
          npm test
          npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          xargs git add -- < /tmp/temperature-changed-paths.txt
          git diff --cached --check
          git commit -m "Make temperature overrides opt-in"
          git push origin HEAD:fix/optional-temperature-override
