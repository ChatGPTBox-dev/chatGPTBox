name: tagged-release
on:
  workflow_dispatch:
    inputs:
      submit_stores:
        description: "Run Chrome, Firefox, and Edge store submission preflight"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Validate store submission without uploading artifacts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

permissions:
  contents: "write"
env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build_and_release:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && 'master' || github.ref_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10' # for appdmg
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: 16.2
      - run: npm ci

      - name: Resolve release version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            version="$(node -p "require('./src/manifest.json').version")"
            echo "VERSION=${version}" >> $GITHUB_ENV
          fi

      - name: Update manifest.json version
        if: github.event_name == 'push'
        uses: jossef/action-set-json-field@890d7642122dbb2833dddd2003659bb71a2b21fe # v2.2
        with:
          file: src/manifest.json
          field: version
          value: ${{ env.VERSION }}

      - name: Update manifest.v2.json version
        if: github.event_name == 'push'
        uses: jossef/action-set-json-field@890d7642122dbb2833dddd2003659bb71a2b21fe # v2.2
        with:
          file: src/manifest.v2.json
          field: version
          value: ${{ env.VERSION }}

      - name: Push files
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git commit -am "release v${{ env.VERSION }}"
          git push

      - if: github.event_name == 'push'
        run: |
          gh release create ${{github.ref_name}} -d -F CURRENT_CHANGE.md -t ${{github.ref_name}}

      - if: github.event_name == 'push'
        run: npm run build:safari

      - if: github.event_name != 'push'
        run: npm run build

      - run: npm run release:firefox-sources

      - name: Upload Chrome package artifact
        if: github.event_name == 'push' || inputs.submit_stores == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chrome-extension
          path: build/chromium.zip
          if-no-files-found: error
          retention-days: 1

      - if: github.event_name == 'push'
        run: |
          gh release upload ${{github.ref_name}} build/chromium.zip
          gh release upload ${{github.ref_name}} build/firefox.zip
          gh release upload ${{github.ref_name}} build/safari.dmg
          gh release upload ${{github.ref_name}} build/chromium-without-katex-and-tiktoken.zip
          gh release upload ${{github.ref_name}} build/firefox-without-katex-and-tiktoken.zip

      - name: Submit stores
        if: github.event_name == 'push' || inputs.submit_stores == 'true'
        run: |
          args=()
          if [ "${{ github.event_name }}" != "push" ]; then
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "::error::Manual store submission only supports dry_run=true. Push a v* tag for a real submission."
              exit 1
            fi
            args+=(--dry-run)
          fi
          npm run release:submit -- "${args[@]}"
        env:
          CHROME_PUBLISH_VIA_ACTION: "true"
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: ${{ secrets.FIREFOX_CHANNEL }}
          FIREFOX_COMPATIBILITY: ${{ secrets.FIREFOX_COMPATIBILITY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

      - if: github.event_name == 'push'
        run: |
          gh release edit ${{github.ref_name}} --draft=false

  publish_chrome:
    if: github.event_name == 'push' || inputs.submit_stores == 'true'
    needs: build_and_release
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      id-token: "write"
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: chrome-extension
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - uses: hamzahamidi/publish-to-chrome-web-store@c8919147f8de0d6f1129bec36345e4a9aa638af9 # v1
        with:
          access-token: ${{ steps.auth.outputs.access_token }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip: chromium.zip
          deploy-percentage: ${{ secrets.CHROME_DEPLOY_PERCENTAGE }}
          skip-review: ${{ secrets.CHROME_REVIEW_EXEMPTION }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
