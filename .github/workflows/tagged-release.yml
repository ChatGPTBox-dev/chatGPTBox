name: tagged-release
on:
  workflow_dispatch:
    inputs:
      submit_stores:
        description: 'Run store submission artifact preflight without store credentials'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    tags:
      - 'v*'

jobs:
  manual_preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - run: npm run build

      - run: npm run release:firefox-sources

      - name: Submit stores preflight
        if: inputs.submit_stores == 'true'
        run: npm run release:submit:preflight

  release:
    if: github.event_name == 'push'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! node -e '
            const version = process.argv[1]
            const parts = version.split(".")
            const valid =
              parts.length >= 3 &&
              parts.length <= 4 &&
              parts.every(
                (part) => /^(0|[1-9][0-9]*)$/.test(part) && Number(part) <= 65535,
              )
            if (!valid) process.exit(1)
          ' "$version"; then
            echo "::error::Release tags must use canonical 3-4 part versions with components from 0 to 65535"
            exit 1
          fi

      - name: Resolve release version
        run: printf 'VERSION=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Update manifest.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/manifest.json
          field: version
          value: ${{ env.VERSION }}

      - name: Update manifest.v2.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/manifest.v2.json
          field: version
          value: ${{ env.VERSION }}

      - name: Push files
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add src/manifest.json src/manifest.v2.json
          report_sync_warning() {
            echo "::warning::$1"
            echo "Release version sync warning: $1" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
          }
          release_version_is_newer() {
            node -e '
              const [remote, requested] = process.argv.slice(1)
              const parse = (version) => {
                const parts = version.split(".")
                const valid =
                  parts.length >= 3 &&
                  parts.length <= 4 &&
                  parts.every(
                    (part) => /^(0|[1-9][0-9]*)$/.test(part) && Number(part) <= 65535,
                  )
                if (!valid) process.exit(2)
                return parts.map(Number)
              }
              const compare = (left, right) => {
                const length = Math.max(left.length, right.length)
                for (let index = 0; index < length; index += 1) {
                  const leftPart = left[index] ?? 0
                  const rightPart = right[index] ?? 0
                  if (leftPart !== rightPart) return leftPart - rightPart
                }
                return 0
              }
              process.exit(compare(parse(remote), parse(requested)) > 0 ? 0 : 1)
            ' "$1" "$2"
          }
          if git diff --cached --quiet; then
            echo "No release version changes to commit"
          elif ! git commit -m "release v${VERSION}"; then
            report_sync_warning "Failed to commit the release version sync; continuing with the release"
          else
            max_attempts=3
            for attempt in $(seq 1 "${max_attempts}"); do
              if ! git fetch origin master; then
                if [ "${attempt}" -eq "${max_attempts}" ]; then
                  report_sync_warning "Failed to fetch origin/master; skipping the release version sync"
                else
                  echo "Release version sync fetch failed; retrying (${attempt}/${max_attempts})"
                  sleep $((attempt * 2))
                fi
              elif release_version_is_newer \
                "$(git show FETCH_HEAD:src/manifest.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" \
                "$VERSION"; then
                report_sync_warning "Skipping older release version sync; origin/master is already newer than v${VERSION}"
                break
              elif [ "$?" -eq 2 ]; then
                report_sync_warning "Skipping release version sync; origin/master has an invalid manifest version"
                break
              elif ! git rebase FETCH_HEAD; then
                git rebase --abort || true
                report_sync_warning "Release version sync conflicted with origin/master; skipping the master push"
                break
              elif git push origin HEAD:master; then
                echo "Release version sync succeeded" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" || true
                break
              elif [ "${attempt}" -eq "${max_attempts}" ]; then
                report_sync_warning "Failed to push the release version sync; continuing with the release"
              else
                echo "Release version sync push rejected; retrying (${attempt}/${max_attempts})"
                sleep $((attempt * 2))
              fi
            done
          fi

      - name: Checkout release tag for artifacts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10' # for appdmg
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.2
      - run: npm ci

      - name: Update release artifact manifest.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/manifest.json
          field: version
          value: ${{ env.VERSION }}

      - name: Update release artifact manifest.v2.json version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: src/manifest.v2.json
          field: version
          value: ${{ env.VERSION }}

      - name: Prepare GitHub release
        run: |
          release_response="$(gh api --include --jq '[.draft, [.assets[].name]]' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1 || true)"
          release_status="$(printf '%s\n' "$release_response" \
            | sed -n 's/^HTTP\/[^ ]* \([0-9][0-9][0-9]\) .*/\1/p' \
            | tail -n 1)"
          if [ "$release_status" = "200" ]; then
            release_metadata="$(printf '%s\n' "$release_response" | tail -n 1)"
            release_is_draft="$(printf '%s\n' "$release_metadata" | jq -r '.[0]')"
            if [ "$release_is_draft" != "true" ]; then
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
              echo "Release $RELEASE_TAG is already published; skipping rerun"
            else
              release_has_asset() {
                printf '%s\n' "$release_metadata" \
                  | jq -e --arg asset "$1" '.[1] | index($asset) != null' >/dev/null
              }
              skip_chrome_store=false
              skip_firefox_store=false
              skip_edge_store=false
              if release_has_asset "store-submission-complete.marker"; then
                skip_chrome_store=true
                skip_firefox_store=true
                skip_edge_store=true
              else
                release_has_asset "store-submission-complete.chrome.marker" \
                  && skip_chrome_store=true
                release_has_asset "store-submission-complete.firefox.marker" \
                  && skip_firefox_store=true
                release_has_asset "store-submission-complete.edge.marker" \
                  && skip_edge_store=true
              fi
              if [ "$skip_chrome_store" = "true" ]; then
                echo "SKIP_CHROME_STORE=true" >> "$GITHUB_ENV"
              fi
              if [ "$skip_firefox_store" = "true" ]; then
                echo "SKIP_FIREFOX_STORE=true" >> "$GITHUB_ENV"
              fi
              if [ "$skip_edge_store" = "true" ]; then
                echo "SKIP_EDGE_STORE=true" >> "$GITHUB_ENV"
              fi
              if [ "$skip_chrome_store" = "true" ] \
                && [ "$skip_firefox_store" = "true" ] \
                && [ "$skip_edge_store" = "true" ]; then
                echo "SKIP_STORE_SUBMISSION=true" >> "$GITHUB_ENV"
                echo "All store submissions are complete; resuming release publication"
              fi
            fi
          elif [ "$release_status" = "404" ]; then
            gh release create "$RELEASE_TAG" -d -F CURRENT_CHANGE.md -t "$RELEASE_TAG"
          else
            printf '%s\n' "$release_response" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

      - run: npm run build
        if: env.SKIP_RELEASE != 'true' && env.SKIP_STORE_SUBMISSION != 'true'

      - run: npm run build:safari
        if: env.SKIP_RELEASE != 'true' && env.SKIP_STORE_SUBMISSION != 'true'

      - run: npm run release:firefox-sources
        if: env.SKIP_RELEASE != 'true' && env.SKIP_STORE_SUBMISSION != 'true'

      - run: |
          gh release upload "$RELEASE_TAG" --clobber build/chromium.zip
          gh release upload "$RELEASE_TAG" --clobber build/firefox.zip
          gh release upload "$RELEASE_TAG" --clobber build/safari.dmg
          gh release upload "$RELEASE_TAG" --clobber build/chromium-without-katex-and-tiktoken.zip
          gh release upload "$RELEASE_TAG" --clobber build/firefox-without-katex-and-tiktoken.zip
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        if: env.SKIP_RELEASE != 'true' && env.SKIP_STORE_SUBMISSION != 'true'

      - name: Submit Chrome store
        run: npm run release:submit -- --store chrome
        if: env.SKIP_RELEASE != 'true' && env.SKIP_CHROME_STORE != 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ secrets.CHROME_PUBLISH_TARGET }}
          CHROME_DEPLOY_PERCENTAGE: ${{ secrets.CHROME_DEPLOY_PERCENTAGE }}
          CHROME_REVIEW_EXEMPTION: ${{ secrets.CHROME_REVIEW_EXEMPTION }}

      - name: Mark Chrome store submission complete
        if: env.SKIP_RELEASE != 'true' && env.SKIP_CHROME_STORE != 'true'
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > build/store-submission-complete.chrome.marker
          gh release upload "$RELEASE_TAG" --clobber build/store-submission-complete.chrome.marker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Submit Firefox store
        run: npm run release:submit -- --store firefox --skip-firefox-metadata
        if: env.SKIP_RELEASE != 'true' && env.SKIP_FIREFOX_STORE != 'true'
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          FIREFOX_CHANNEL: ${{ secrets.FIREFOX_CHANNEL }}
          FIREFOX_COMPATIBILITY: ${{ secrets.FIREFOX_COMPATIBILITY }}

      - name: Mark Firefox store submission complete
        if: env.SKIP_RELEASE != 'true' && env.SKIP_FIREFOX_STORE != 'true'
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > build/store-submission-complete.firefox.marker
          gh release upload "$RELEASE_TAG" --clobber build/store-submission-complete.firefox.marker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Update Firefox metadata
        run: npm run release:update-firefox-metadata -- --version "$VERSION"
        if: env.SKIP_RELEASE != 'true'
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Submit Edge store
        run: npm run release:submit -- --store edge
        if: env.SKIP_RELEASE != 'true' && env.SKIP_EDGE_STORE != 'true'
        env:
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}

      - name: Mark Edge store submission complete
        if: env.SKIP_RELEASE != 'true' && env.SKIP_EDGE_STORE != 'true'
        run: |
          printf '%s\n' "$GITHUB_RUN_ID" > build/store-submission-complete.edge.marker
          gh release upload "$RELEASE_TAG" --clobber build/store-submission-complete.edge.marker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}

      - run: |
          gh release edit "$RELEASE_TAG" --draft=false
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
